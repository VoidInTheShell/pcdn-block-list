name: Sync PCDN rules

on:
  schedule:
    # Check the public upstreams every six hours. The fetcher records each
    # upstream SHA-256 in sources.lock.json, so source-only changes are also
    # visible in the generated commit.
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/sync-pcdn.yml"
      - ".gitattributes"
      - "sources.json"
      - "scripts/**"
      - "tests/**"
      - "pcdn_block_adh.txt"
      - "pcdn_block_clash.yaml"
      - "sources.lock.json"
      - "inputs/**"
  pull_request:
    paths:
      - ".github/workflows/sync-pcdn.yml"
      - ".gitattributes"
      - "sources.json"
      - "scripts/**"
      - "tests/**"
      - "pcdn_block_adh.txt"
      - "pcdn_block_clash.yaml"
      - "sources.lock.json"
      - "inputs/**"

concurrency:
  group: pcdn-rule-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate rules from all required upstreams
        run: python scripts/sync_rules.py

      - name: Run parser tests
        run: python -m unittest discover -s tests -v

      - name: Validate generated files and whitespace
        run: |
          python scripts/sync_rules.py --locked --check
          python scripts/validate_mihomo.py --install
          git diff --check

      - name: Commit and publish changed outputs
        run: |
          git add pcdn_block_adh.txt pcdn_block_clash.yaml sources.lock.json inputs
          if git diff --cached --quiet; then
            echo "No rule, lock, or input-snapshot changes."
            exit 0
          fi
          remote_head=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          test "$remote_head" = "$(git rev-parse HEAD)" || { echo "Branch advanced; rerun synchronization."; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync PCDN rules"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run parser tests
        run: python -m unittest discover -s tests -v

      - name: Replay committed inputs without refetching changing upstreams
        run: python scripts/sync_rules.py --locked --check

      - name: Validate native loading and matching
        run: python scripts/validate_mihomo.py --install

      - name: Check whitespace
        run: git diff --check
